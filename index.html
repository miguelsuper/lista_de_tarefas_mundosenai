
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>LISTA DE TAREFAS</h1>
        <p>Organize suas tarefas e coloque seus planos em prática!</p>
    </header>

    <main>

        <section id="adicionar-tarefa">
            <h2>Nova tarefa</h2>

            <input
                type="text"
                id="input-tarefa"
                placeholder="Digite uma tarefa..."
                maxlength="120"
            >

            <button type="button" id="btn-adicionar">
                + Adicionar
            </button>
        </section>

        <section id="minhas-tarefas">
            <h2>Minhas tarefas</h2>

            <ul id="lista-tarefas"></ul>
        </section>

    </main>

    <footer>
        <p>Meu organizador de tarefas © 2026</p>
    </footer>

</body>

</html>
